  - date: '2026-09-01'
    rating: 2
    summary: >-
      Re-profiled under pipeline-university, which settles WHO OPERATES each surface before saving
      anything. Finding: the University of Aberdeen publishes no institution-operated API contract at
      all, and none was written. Its only surfaces that are unambiguously its own engineering are
      identity-federation metadata — a Shibboleth SAML 2.0 IdP, entityID
      https://shibserv.abdn.ac.uk/shibboleth, scope abdn.ac.uk, registered in the Jisc UK Access
      Management Federation (signed metadata, 200, 14194 bytes via MDQ and 200, 15707 bytes served
      directly from shibserv2.abdn.ac.uk), plus a Microsoft Entra ID tenant
      8c2b19ad-5f9c-49d4-9077-3ec3cfc52b3f with live OIDC discovery and WS-Federation metadata. Neither
      was in the June 2026 profile. Every callable API under Aberdeen's name is a tenancy: AURA's
      DSpace REST and OAI-PMH endpoints look institution-owned by hostname but aura.abdn.ac.uk CNAMEs
      to aura.abdn-lb.is.ed.ac.uk and resolves to 129.215.5.66, University of Edinburgh Information
      Services — Aberdeen's repository runs on another university's infrastructure. The Pure research
      portal is Elsevier's, MyAberdeen is Blackboard, discovery is Ex Libris Primo. The Pure OAI-PMH
      endpoint recorded as HTTP 500 in June is live now and has been added. One vendor contract was
      found publicly readable from Aberdeen's own tenant subdomain —
      https://abdn.elsevierpure.com/ws/api/openapi.yaml, 1.3MB, info.title "Pure API", contact
      pure-support@elsevier.com, servers[0].url "/ws/api" (relative and hostless) — and was rejected,
      not saved. Three registry memberships were evidenced and recorded: DataCite HUGZ / repository
      BL.ABDN, Crossref 12669 (prefixes 10.57064, 10.57132, 795 DOIs), ROR 016476m91. Negative
      findings are real: no api./developer./data./opendata./timetable./hpc. host on abdn.ac.uk
      resolves, there is no sitemap.xml or llms.txt, the course catalogue is HTML only, and
      github.com/uofa holds 17 repositories of which all 17 are forks. AURA is also intermittently
      degraded: its Angular UI returned 503 after 31s and 502 after 60s, and six back-to-back backend
      probes gave four 200s at ~0.36s, one 503 and one timeout.
    endpoints:
