  - date: '2026-06-03'
    rating: 2
    summary: >-
      Verified two live public APIs on the Aberdeen University Research Archive
      (AURA), which runs DSpace 8.1: a HATEOAS DSpace REST API at /server/api and an
      OAI-PMH 2.0 endpoint at /server/oai/request (repository name "Aura", protocol
      version 2.0). The Elsevier Pure research portal (abdn.elsevierpure.com) is live
      but its OAI web service returned HTTP 500 and is not treated as public. No
      general developer portal, course/timetable/SIS, or library Alma/Primo API was
      found publicly documented; those appear internal/gated. The verified GitHub org
      (github.com/uofa, domain abdn.ac.uk) hosts mostly forks, not API specs. No
      endpoints were fabricated; all URLs below were probed live.
    endpoints:
      - url: https://www.abdn.ac.uk/
        status: 200
        note: Official university website.
      - url: https://aura.abdn.ac.uk/
        status: 200
        note: AURA open-access institutional repository (DSpace 8).
      - url: https://aura.abdn.ac.uk/server/api
        status: 200
