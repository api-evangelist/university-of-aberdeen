  - aid: university-of-aberdeen:aura-dspace-rest
    name: AURA DSpace REST API (tenancy on Edinburgh IS infrastructure)
    description: >-
      The Aberdeen University Research Archive (AURA) runs DSpace 8.1-SNAPSHOT and exposes a public
      HATEOAS REST API advertising 79 endpoint families — communities, collections, items, bitstreams,
      discovery/search, statistics, configuration, versioning, workflow and the COAR Notify
      submission endpoints. Retrieved live 2026-09-01: the API root returns 200 in 0.37s with
      dspaceName "Aura" and 182 communities. The content, the metadata and the administration are
      Aberdeen's (adminEmail aura-manager@abdn.ac.uk), but the hosting is not: aura.abdn.ac.uk CNAMEs
      to aura.abdn-lb.is.ed.ac.uk and resolves to 129.215.5.66, University of Edinburgh address space,
      "abdn-lb" being an Aberdeen load balancer inside Edinburgh Information Services. The contract is
      DSpace's, the deployment is Edinburgh's, the data is Aberdeen's. Recorded as a tenant
      relationship; no DSpace specification is held under this slug. Note the Angular user interface at
      aura.abdn.ac.uk/ and /home was returning 503 and 502 proxy errors on 2026-09-01 while the REST
      and OAI backends answered in under half a second — the machine surface is healthier than the
      human one.
    humanURL: https://www.abdn.ac.uk/library/open-research/
    baseURL: https://aura.abdn.ac.uk/server/api
    tags: [ Research, Open Access, Institutional Repository, DSpace, REST, Tenant ]
    properties:
      - type: Documentation
        url: https://aura.abdn.ac.uk/server/api
      - type: ResearchRepository
        url: https://www.abdn.ac.uk/library/open-research/
      - type: Conformance
        url: conformance/university-of-aberdeen-conformance.yml
    x-operator: tenant
    x-operator-basis: >-
      DNS: aura.abdn.ac.uk CNAME aura.abdn-lb.is.ed.ac.uk, A 129.215.5.66 (University of Edinburgh).
      The hostname is on Aberdeen's own registrable domain, so a host-name verdict reads this as
      institution-operated; the CNAME shows it is not. Software self-declaration: dspaceVersion
      "DSpace 8.1-SNAPSHOT".
    x-vendor: DSpace (LYRASIS), deployed by University of Edinburgh Information Services
    x-probe:
