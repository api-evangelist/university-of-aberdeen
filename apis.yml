---
aid: university-of-aberdeen
name: University of Aberdeen
description: >-
  The University of Aberdeen is a public research university in Aberdeen, Scotland, founded in 1495
  and one of the four ancient universities of Scotland. Its programmable footprint is small, real, and
  almost entirely operated by somebody else. The University publishes NO institution-operated API
  contract: there is no api.abdn.ac.uk, no developer.abdn.ac.uk, no data.abdn.ac.uk, no open data
  portal, no public course, timetable or student-information-system API, no llms.txt and no sitemap.xml,
  and its verified GitHub organization (github.com/uofa) holds seventeen repositories of which every
  single one is a fork. What it does operate in machine-readable form is its identity estate: a
  Shibboleth SAML 2.0 Identity Provider, entityID https://shibserv.abdn.ac.uk/shibboleth, scope
  abdn.ac.uk, registered in the Jisc UK Access Management Federation and served as signed metadata
  through the federation MDQ service and directly from shibserv2.abdn.ac.uk, plus a Microsoft Entra ID
  tenant (8c2b19ad-5f9c-49d4-9077-3ec3cfc52b3f) with live OIDC discovery and WS-Federation metadata.
  Everything else that looks like an Aberdeen API is a tenancy. AURA, the Aberdeen University Research
  Archive, runs DSpace 8.1 and exposes a HATEOAS REST API and a thirteen-format OAI-PMH 2.0 endpoint —
  but aura.abdn.ac.uk CNAMEs to aura.abdn-lb.is.ed.ac.uk and resolves into University of Edinburgh
  Information Services address space, so the deployment is Edinburgh's and the software is DSpace's.
  The research portal at abdn.elsevierpure.com is Elsevier Pure; it serves a second OAI-PMH repository
  and a publicly readable 1.3MB openapi.yaml whose own info.title is "Pure API" and whose contact is
  pure-support@elsevier.com — that contract is Elsevier's and is deliberately not held under this slug.
  MyAberdeen is Blackboard Learn and library discovery is Ex Libris Primo. The University is a Crossref
  member (12669, prefixes 10.57064 and 10.57132) and a DataCite member (HUGZ) operating the registered
  institutional repository BL.ABDN. Recorded honestly: one institution-operated surface class, five
  tenancies, three registry memberships, and zero API contracts of its own.
