  detail: >-
    Probed live on 2026-09-01 under pipeline-university. The University of Aberdeen operates ONE
    institution-owned machine-readable surface class and it is not an API: its Shibboleth SAML 2.0
    Identity Provider, entityID https://shibserv.abdn.ac.uk/shibboleth, scope abdn.ac.uk, published as
    signed metadata through the Jisc UK Access Management Federation MDQ service (200, 14194 bytes) and
    served directly from the University's own host shibserv2.abdn.ac.uk (200, 15707 bytes), alongside a
    Microsoft Entra ID tenant (8c2b19ad-5f9c-49d4-9077-3ec3cfc52b3f) with live OIDC discovery and
    WS-Federation metadata. Zero institution-operated API contracts were found and none were written.
    Five surfaces are real but tenant-operated and are recorded as relationships without holding the
    supplier's specification: AURA DSpace REST and OAI-PMH (aura.abdn.ac.uk CNAMEs to
    aura.abdn-lb.is.ed.ac.uk, 129.215.5.66, University of Edinburgh Information Services — a
    host-name verdict reads this as institution-operated and is wrong), Elsevier Pure REST and OAI-PMH
    (abdn.elsevierpure.com CNAME eu.prod.elsevierpure.com), Blackboard Learn, and Ex Libris Primo VE.
    Three registry memberships are recorded as facts about the institution: DataCite HUGZ / BL.ABDN,
    Crossref 12669, ROR 016476m91. One vendor contract was found and deliberately rejected:
    https://abdn.elsevierpure.com/ws/api/openapi.yaml, 1,313,865 bytes, info.title "Pure API",
    info.contact.email pure-support@elsevier.com, servers[0].url "/ws/api" (relative and hostless) —
    served from an Aberdeen-branded host and exactly the shape that got 36 Pure documents attributed to
    Manchester. The profile is thin because the institution is thin, not because the probe was: no
    api.abdn.ac.uk, developer.abdn.ac.uk, developers.abdn.ac.uk, data.abdn.ac.uk, opendata.abdn.ac.uk,
    timetable.abdn.ac.uk or hpc.abdn.ac.uk resolves at all; www.abdn.ac.uk has no sitemap.xml and no
    llms.txt; the course catalogue and registry pages are HTML only with no JSON behind them; and the
    verified GitHub organization github.com/uofa holds 17 repositories of which 17 are forks and 0 are
    original work. One genuine degradation was observed and is not a probe artefact: AURA's Angular
    user interface returned 503 after 31 seconds and 502 after 60 seconds while its REST API and
    OAI-PMH backend answered 200 in 0.37 seconds — the machine surface is healthier than the human one,
    which is why the AURA humanURL now points at the library's open-research page rather than at
    aura.abdn.ac.uk. A stale UK federation SP registration also survives: entityID
    https://primo.abdn.ac.uk/shib is served by MDQ (200) but primo.abdn.ac.uk no longer resolves.
