  - aid: university-of-aberdeen:aura-oai-pmh
    name: AURA OAI-PMH Metadata Harvesting (tenancy on Edinburgh IS infrastructure)
    description: >-
      AURA's OAI-PMH 2.0 endpoint, repositoryName "Aura", repositoryIdentifier aura.abdn.ac.uk,
      adminEmail aura-manager@abdn.ac.uk, earliest datestamp 2005-10-10. ListMetadataFormats offers
