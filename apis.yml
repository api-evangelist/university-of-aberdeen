apis:
  - aid: university-of-aberdeen:shibboleth-saml-idp
    name: Shibboleth SAML Identity Provider (UK Access Management Federation)
    description: >-
      The University's own Shibboleth Identity Provider, entityID
      https://shibserv.abdn.ac.uk/shibboleth, asserting shibmd:Scope abdn.ac.uk. Its entity descriptor
      is published as signed, machine-readable SAML metadata through the Jisc UK Access Management
      Federation MDQ service and onward into eduGAIN, and is also served directly by the institution
      from shibserv2.abdn.ac.uk. Retrieved live on 2026-09-01 — 200, 14194 bytes of
      application/samlmetadata+xml from the federation, 200 and 15707 bytes of application/xml from
      Aberdeen's own host. Advertises SAML 2.0, SAML 1.1 and the native Shibboleth authn profile over
      HTTP-Redirect, HTTP-POST and HTTP-POST-SimpleSign, plus an AttributeAuthorityDescriptor. This is
      the only surface in this repository that is unambiguously the institution's own engineering, and
      it is the class the June 2026 profile of this repo missed entirely. It is not a public developer
      API: an application cannot obtain an assertion without being registered as a service provider in
      the federation.
    humanURL: https://www.abdn.ac.uk/it/
    baseURL: http://mdq.ukfederation.org.uk/entities/https%3A%2F%2Fshibserv.abdn.ac.uk%2Fshibboleth
    tags: [ Identity, SSO, SAML, Shibboleth, Federation, eduGAIN ]
    properties:
      - type: IdentityFederation
        url: http://mdq.ukfederation.org.uk/entities/https%3A%2F%2Fshibserv.abdn.ac.uk%2Fshibboleth
      - type: Documentation
        url: https://shibserv2.abdn.ac.uk/idp/shibboleth
      - type: Conformance
        url: conformance/university-of-aberdeen-conformance.yml
    x-operator: institution
    x-operator-basis: >-
      Signed EntityDescriptor from the UK Access Management Federation names OrganizationName
      "University of Aberdeen", OrganizationDisplayName "University of Aberdeen" and shibmd:Scope
      "abdn.ac.uk", with technical contact mailto:webmaster@abdn.ac.uk. The SSO endpoints it advertises
      are all on shibserv2.abdn.ac.uk (5.101.151.154), which serves the same descriptor itself.
    x-entity-id: https://shibserv.abdn.ac.uk/shibboleth
    x-sso-endpoint: https://shibserv2.abdn.ac.uk/idp/profile/SAML2/Redirect/SSO
    x-probe:
      baseURL_status: 200
      self_published_metadata_status: 200
      sso_endpoint_bare_get_status: 400
      note: >-
        baseURL is the federation MDQ location because that is the machine-readable artifact an agent
        can actually retrieve. MDQ is served over HTTP only; https://mdq.ukfederation.org.uk does not
        answer. The SSO endpoint returns 400 to a bare GET because it requires a SAMLRequest — that is
        protocol behaviour, not an outage, and it is recorded in x-sso-endpoint rather than as a
        pointer. shibserv.abdn.ac.uk (the entityID host) does not resolve publicly; entityIDs are
        names, not addresses.
      probed: '2026-09-01'
