x-attribution-correction:
  date: '2026-09-01'
  summary: >-
    No artifacts were deleted — this repository held no OpenAPI documents to misattribute, which is why
    it survived the cohort-wide vendor purge untouched. The correction here is one of labelling. The
    two AURA surfaces were carried as unqualified institution surfaces; DNS shows aura.abdn.ac.uk
    CNAMEs into University of Edinburgh Information Services, so both are now x-operator tenant with
    the CNAME recorded as the basis. Seven surfaces were added that the June 2026 profile missed
    entirely: the Shibboleth SAML IdP in the UK Access Management Federation and the Entra ID tenant
    (the institution's only genuinely own machine-readable surfaces), the Pure OAI-PMH endpoint that
    was recorded as HTTP 500 in June and is live now, the Blackboard Learn and Primo VE tenancies, and
    the DataCite, Crossref and ROR registry memberships. One vendor contract discovered during the run
    — Elsevier's Pure openapi.yaml, publicly readable from Aberdeen's own tenant subdomain — was
    rejected rather than saved.
